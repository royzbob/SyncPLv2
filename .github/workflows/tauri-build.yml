name: 'publish'

on:
  push:
    tags:
      - 'v*' # Trigger build whenever a new tag (e.g. v1.0.0) is pushed to GitHub

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: npm install

      - name: Build and Publish
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # Auto-replaced with version in tauri.conf.json
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets below to download the latest version for Windows.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
