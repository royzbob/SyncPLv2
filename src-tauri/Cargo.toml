[package]
name = "syncpl-trading"
version = "1.0.3"
description = "SyncPL Trading Dashboard"
authors = ["1NathanDrew6"]
edition = "2021"

[lib]
name = "syncpl_trading_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
